# El Halfawy — Nginx 1.18 (Ubuntu) site configuration
# Copy to /etc/nginx/sites-available/elhalfawy, symlink into sites-enabled, then:  sudo nginx -t && sudo systemctl reload nginx
#
# Deploy:  npm ci && npm run build   ->   rsync -a --delete dist/ /var/www/elhalfawy/dist/

server {
    listen 80;
    listen [::]:80;
    server_name elhalfawy.com www.elhalfawy.com;

    # --- after you add a certificate (certbot --nginx) keep this redirect and put the rest in the 443 block -----------
    # return 301 https://elhalfawy.com$request_uri;

    root /var/www/elhalfawy/dist;
    index index.html;
    charset utf-8;

    # ------------------------------------------------------------------ compression
    # The build already ships pre-compressed *.gz files (vite-plugin-compression2) -> served with zero CPU cost.
    gzip_static on;
    # fallback for anything that has no pre-built .gz (e.g. JSON, SVG, hand-edited files)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript
               application/xml application/rss+xml image/svg+xml application/manifest+json;
    # Images/fonts (webp, png, jpg, woff2) are already compressed — deliberately NOT in gzip_types.

    # Brotli (about 15-20 % smaller than gzip). Needs the module:  sudo apt install libnginx-mod-http-brotli-static libnginx-mod-http-brotli-filter
    # The build already contains *.br files, so enabling the line below is all that is required:
    # brotli_static on;

    # ------------------------------------------------------------------ security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content-Security-Policy: allows exactly what the site uses (Google Maps iframe + formsubmit.co contact form).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://www.google.com; connect-src 'self' https://formsubmit.co; base-uri 'self'; form-action 'self' https://formsubmit.co; object-src 'none'" always;

    # ------------------------------------------------------------------ caching
    # Hashed build output (JS, CSS, images, fonts): the file name changes whenever the content changes -> cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # security headers must be repeated here because add_header in a location resets the inherited ones
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;            # a missing asset must be a real 404, never index.html
    }

    # Icons / favicons (not hashed): one week
    location ~* \.(?:png|ico|svg|webp)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must never be cached for long, otherwise visitors would not see new releases.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ------------------------------------------------------------------ SPA fallback
    # The site uses hash routing by default (#/about) and then only "/" is ever requested.
    # With VITE_ROUTER=browser (clean URLs) every unknown path must return index.html so a refresh on /about works.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-src https://www.google.com; connect-src 'self' https://formsubmit.co; base-uri 'self'; form-action 'self' https://formsubmit.co; object-src 'none'" always;
    }

    # never serve hidden files
    location ~ /\.(?!well-known) { deny all; }

    access_log /var/log/nginx/elhalfawy.access.log;
    error_log  /var/log/nginx/elhalfawy.error.log warn;
}
